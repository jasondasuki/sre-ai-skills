name: scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked files
        run: .github/scripts/scan-repo.sh "${BASE_REF:+origin/$BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}
